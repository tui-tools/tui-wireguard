# Generated from tui-kit/templates/scorecard.yml.
#
# Scorecard grades the repository's own supply-chain posture — branch
# protection, pinned actions, signed releases, whether a security policy
# exists — from the outside, the same way a person deciding whether to trust
# the tool would. Publishing the result is the point: the score is public and
# the badge links to the run that produced it, so the claim is checkable
# rather than asserted.
name: Scorecard

on:
  branch_protection_rule:
  schedule:
    # Weekly. The score moves with GitHub settings and with dependencies, not
    # only with commits, so it has to run on a clock as well as on a push.
    - cron: "27 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: analyze
    runs-on: ubuntu-latest
    # Scorecard grades a repository from the outside and publishes the
    # result, which it can only do for a public one; the upload also needs
    # code scanning, and that needs Advanced Security. tui-wireguard is private
    # until its first release, so the job skips itself until the day the
    # repository is made public. The workflow is otherwise the family's.
    if: github.event.repository.visibility == 'public'
    permissions:
      # Upload the findings to the repository's code scanning view.
      security-events: write
      # Publish the result to the public OpenSSF API, which is what lets the
      # badge and deps.dev read it. Keyless, via the workflow's OIDC token.
      id-token: write
      contents: read
      actions: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: run analysis
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      # Kept for a while as a plain file too: code scanning only retains the
      # latest, and a regression is easier to read against the previous run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
